title: "Stations & embassies"
description: "Physical places that support participation and shared work. Stations proposes local spaces for learning, collaboration, tools, care and infrastructure. It also distinguishes those community functions from the separate proposal for institutional embassies."
remote_theme: draykerdk/drayker-theme
url: "https://stations.drayker.org"
dk_kicker: "Places"
dk_subdomain: "stations.drayker.org"
dk_repo: "https://github.com/draykerdk/stations"


# jekyll-remote-theme fetches the shared layout; jekyll-optional-front-matter lets
# README.md render without front matter; the defaults block is what actually applies
# the layout to it. Without all three, GitHub Pages serves bare converted markdown.
plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

# The official mark, recoloured. Geometry is fixed for every project
# (DRAYKER-MARK.md §2.5); only the globe carries the scope.
dk_accent: "#E0A46B"  # ground: fired clay, where the network touches earth
