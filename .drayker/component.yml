schema_version: 1
component:
  id: stations
  name: Stations & embassies
  layer: PLATFORM
  artifact_type: architecture
  problem: "Stations, centres and embassies are physical presence, support and local context for the ecosystem: an organization with nowhere to be reaches only the people who were already online and already able."
  scope:
    - "Public description of stations as physical presence, support and local context."
    - "Public description of stations as a project model."
    - "Public description of the distinction between support stations, centres and embassies."
    - "Public description of activity first, and what evidence would justify a physical place."
    - "Public description of production, research and service variants."
    - "Public description of relation to distributed support, Academy and the economy."
    - "Public description of local emergence inside one global body."
  non_scope:
    - "An existing centre, embassy or physical facility."
    - "A property, residency or relocation offer."
    - "Any commitment to open a place, anywhere, on any timeline."
  dependencies:
    - dsupport
    - daf
    - valueunit
  implementation:
    level: none
    scope: This repository publishes a charter and open questions; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Design language may be mistaken for an available capability.
    - The absence of a specification can leave contributions without a clear target.
    - Stations could be mistaken for an operating network of properties; they are a model, and physical places require evidence of demand.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/stations/issues
  source_of_truth:
    repository: https://github.com/draykerdk/stations
    path: README.md
  last_reviewed: "2026-08-17"
