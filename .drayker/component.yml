schema_version: 1
component:
  id: stations
  name: Stations & embassies
  layer: PLATFORM
  artifact_type: architecture
  problem: "Physical presence, support and local context for the ecosystem: an organization with nowhere to be reaches only the people who were already online and already able."
  scope:
    - "Public description of multiple tiers of physical support structures for members."
    - "Public description of local stations and postos: community hubs for member practical work, study, hardware access and mutual support."
    - "Public description of embassies: bilateral diplomatic and strategic cooperation agreements with sovereign states for climate security, disaster anticipation and multilateral technology cooperation."
    - "Public description of complementary roles: local hubs serve member everyday needs, while embassies articulate sovereign multilateral agreements."
    - "Public description of activity first, and what evidence justifies physical installation."
    - "Public description of relation to distributed support, Academy and the capacity economy."
  non_scope:
    - "An existing operational embassy or physical facility today."
    - "A commercial property, speculative real estate or residency offer."
    - "Any unilateral claim of state territorial sovereignty."
  dependencies:
    - dsupport
    - daf
    - valueunit
  implementation:
    level: none
    scope: This repository publishes a charter and architectural foundations; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Design language may be mistaken for an available capability.
    - The absence of a specification can leave contributions without a clear target.
    - Stations could be mistaken for an operating network of properties; they are a model requiring validated community demand or bilateral state agreements.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/stations/issues
  source_of_truth:
    repository: https://github.com/draykerdk/stations
    path: README.md
  last_reviewed: "2026-09-08"
