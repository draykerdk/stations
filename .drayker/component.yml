schema_version: 1
component:
  id: stations
  name: Stations & embassies
  layer: PLATFORM
  artifact_type: architecture
  problem: "Physical presence, support and local context for the ecosystem: a supersystem with nowhere to be reaches only the people who were already online and already able."
  scope:
    - "Public description of multiple tiers of physical support structures for members."
    - "Public description of local stations and postos: community hubs for member practical work, study, hardware access and mutual support, where tools and hardware are kept, members pass on what they have learned and projects receive physical support that no individual could keep up alone."
    - "Public description of embassies: agreements with sovereign states for climate security, disaster anticipation and technology cooperation, most often as an autonomous zone on territory a state cedes with the support of its people."
    - "Public description of pure autonomous zones on the high seas, where no territory needs to be ceded, and of a whole country adopting the Drayker infrastructure in a local and customized version isolated from the global network, where each person has a UID in that system, using it does not make anyone a member, and whoever also makes it a member UID has the two integrated, almost like two nationalities."
    - "Public description of stations as Drayker properties anywhere in the world, like offices for welcoming members, study, research and work, without needing to be autonomous zones; autonomous zones include housing."
    - "Public description of complementary roles: local hubs serve member everyday needs, while embassies articulate sovereign bilateral agreements."
    - "Public description of a station beginning as a project, with its place following from what the project already delivers and needs."
    - "Public description of an embassy as cooperation, never extraction: it exists only with the support of the local population and the agreement of the state, and people affected from outside receive accessible information, representation, negotiation of conditions and means of repair."
    - "Public description of relation to distributed support, Academy and the capacity economy."
  non_scope:
    - "An existing operational embassy or physical facility today."
    - "Speculative real estate, or property and residency sold as products."
    - "Any claim over a state's territory without that state's consent. Pure autonomous zones on the high seas need no cession."
  dependencies:
    - dsupport
    - daf
    - valueunit
  implementation:
    level: none
    scope: This repository publishes a charter and architectural foundations; nothing is implemented.
    evidence:
      - type: document
        ref: README.md
  risks:
    - Design language may be mistaken for an available capability.
    - The absence of a specification can leave contributions without a clear target.
    - Stations could be mistaken for an operating network of properties; they are a model requiring validated community demand or bilateral state agreements.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/stations/issues
  source_of_truth:
    repository: https://github.com/draykerdk/stations
    path: README.md
  last_reviewed: "2026-10-19"
